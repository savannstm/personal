[unstable]
build-std = ["core", "alloc", "std", "panic_abort"]
profile-rustflags = true

[build]
build-dir = "C:/Users/savannstm/cargo-build"

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-Clinker=lld-link",
    "-Clink-arg=-fuse-ld=lld",
    "-Ctarget-cpu=x86-64-v3",
    "-Ctarget-feature=+aes",
    "-Zunstable-options",
]

[target.x86_64-pc-windows-gnullvm]
linker = "clang"
rustflags = [
    "-Clinker=clang",
    "-Clink-arg=-fuse-ld=lld",
    "-Ctarget-cpu=x86-64-v3",
    "-Ctarget-feature=+aes",
    "-Lnative=C:/dev-clang/release/lib",
    "-Zunstable-options",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-Clinker=clang",
    "-Clink-arg=-fuse-ld=lld",
    "-Ctarget-cpu=x86-64-v3",
    "-Ctarget-feature=+aes",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-Clinker=clang",
    "-Clink-arg=-fuse-ld=lld",
    "-Ctarget-cpu=x86-64-v3",
    "-Ctarget-feature=+aes",
]

[profile.win-msvc-debug]
inherits = "dev"
panic = "abort"
rustflags = [
    "-Clink-arg=-DEBUG:FULL",
    "-Clink-arg=-OPT:NOREF",
    "-Clink-arg=-OPT:NOICF",
    "-Clink-arg=-OPT:NOLBR",
    "-Lnative=C:/dev/debug/lib",
]

[profile.win-clang-debug]
inherits = "dev"
panic = "abort"
rustflags = ["-Lnative=C:/dev-clang/debug/lib"]

[profile.win-msvc-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
rustflags = [
    "-Ctarget-feature=+crt-static",
    "-Clinker-plugin-lto",
    "-Cprefer-dynamic=no",
    "-Cembed-bitcode=yes",
    "-Zdylib-lto",
    "-Zdefault-visibility=hidden",

    "-Cllvm-args=-function-sections=true",
    "-Cllvm-args=-data-sections=true",
    "-Cllvm-args=-fp-contract=fast",
    "-Cllvm-args=-denormal-fp-math=positive-zero",
    "-Cllvm-args=-enable-no-trapping-fp-math=true",
    "-Cllvm-args=-unroll-threshold=750",

    "-Clink-arg=-DEBUG:NONE",
    "-Clink-arg=-LTCG",
    "-Clink-arg=-OPT:REF",
    "-Clink-arg=-OPT:ICF=10",
    "-Clink-arg=-OPT:LBR",
    "-Clink-arg=-INCREMENTAL:NO",
    "-Clink-arg=-SAFESEH:NO",
    "-Clink-arg=-EMITTOOLVERSIONINFO:NO",
    "-Clink-arg=-NOCOFFGRPINFO",
    "-Clink-arg=-EMITPOGOPHASEINFO",
    "-Clink-arg=-EMITVOLATILEMETADATA:NO",
    "-Clink-arg=-Brepro",
    "-Clink-arg=-OPT:LLDLTO=3",
    "-Lnative=C:/dev/release/lib",
]

[profile.win-clang-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
rustflags = [
    "-Ctarget-feature=+crt-static",
    "-Clinker-plugin-lto",
    "-Cprefer-dynamic=no",
    "-Cembed-bitcode=yes",
    "-Zdylib-lto",
    "-Zdefault-visibility=hidden",

    "-Cllvm-args=-function-sections=true",
    "-Cllvm-args=-data-sections=true",
    "-Cllvm-args=-fp-contract=fast",
    "-Cllvm-args=-denormal-fp-math=positive-zero",
    "-Cllvm-args=-enable-no-trapping-fp-math=true",
    "-Cllvm-args=-unroll-threshold=750",

    "-Clink-arg=-Wl,-O3",
    "-Clink-arg=-Wl,--lto-O3",
    "-Clink-arg=-Wl,--gc-sections",
    "-Clink-arg=-Wl,--as-needed",
    "-Clink-arg=-Wl,--strip-all",
    "-Clink-arg=-Wl,--build-id=none",
    "-Clink-arg=-Wl,--icf=all",
    "-Clink-arg=-Wl,--no-insert-timestamp",
    "-Lnative=C:/dev-clang/release/lib",
]

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
rustflags = [
    "-Zunstable-options",
    "-Zdefault-visibility=hidden",

    "-Cllvm-args=-function-sections=true",
    "-Cllvm-args=-data-sections=true",
    "-Cllvm-args=-fp-contract=fast",
    "-Cllvm-args=-denormal-fp-math=positive-zero",
    "-Cllvm-args=-enable-no-trapping-fp-math=true",
    "-Cllvm-args=-unroll-threshold=750",
]

[profile.linux-debug]
inherits = "dev"

[profile.linux-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
rustflags = [
    "-Clinker-plugin-lto",
    "-Cprefer-dynamic=no",
    "-Cembed-bitcode=yes",

    "-Cllvm-args=-function-sections=true",
    "-Cllvm-args=-data-sections=true",
    "-Cllvm-args=-fp-contract=fast",
    "-Cllvm-args=-denormal-fp-math=positive-zero",
    "-Cllvm-args=-enable-no-trapping-fp-math=true",
    "-Cllvm-args=-unroll-threshold=750",

    "-Clink-arg=-Wl,-O3",
    "-Clink-arg=-Wl,--lto-O3",
    "-Clink-arg=-Wl,--gc-sections",
    "-Clink-arg=-Wl,--as-needed",
    "-Clink-arg=-Wl,--strip-all",
    "-Clink-arg=-Wl,--build-id=none",
    "-Clink-arg=-Wl,--icf=all",

    "-Clink-arg=-Wl,-z,now",
    "-Clink-arg=-Wl,-z,norelro",
    "-Clink-arg=-Wl,-z,nosectionheader",
]
