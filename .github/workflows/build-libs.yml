name: Build libraries

on:
    workflow_dispatch:
        inputs:
            only:
                description: "Only build these libraries (comma-separated, empty = all)"
                default: ""
            retrain:
                description: "Retrain the PGO profiles even if profiles for this build's library versions and compiler are cached (also drops the cached prefixes and resume state, so everything is rebuilt with the new profiles)"
                type: boolean
                default: false

# One build at a time: runs share the cached prefix and build-state.json.
concurrency:
    group: build-libs
    cancel-in-progress: false

jobs:
    # The PGO profiles are named after a key of the versions they're trained from (library pins and the compiler's version;
    # see resolvePgoProfiles in pgo.ts) and cached under that name. Only a profile that isn't cached for the current key is
    # trained, so a library or compiler update retrains exactly what it affects; anything else needs `retrain`. LLVM's profile trains in
    # stages, each its own job: the IR profiles of clang (needs no libraries) and of lld (links the PGO libraries) in
    # parallel, then the final profile's context-sensitive stage, which builds clang and lld together from both.
    pgo-keys:
        name: PGO keys
        runs-on: windows-2025
        permissions:
            actions: write # retrain deletes caches
            contents: read
        outputs:
            libs: ${{ steps.keys.outputs.libs }}
            llvm: ${{ steps.keys.outputs.llvm }}
            ir-clang: ${{ steps.keys.outputs.ir-clang }}
            ir-lld: ${{ steps.keys.outputs.ir-lld }}
            libs-hit: ${{ steps.hit-libs.outputs.cache-hit }}
            llvm-hit: ${{ steps.hit-llvm.outputs.cache-hit }}
            ir-clang-hit: ${{ steps.hit-ir-clang.outputs.cache-hit }}
            ir-lld-hit: ${{ steps.hit-ir-lld.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup

            # Installs the toolchain packages first (the keys include CLANG64's clang version), hence the filter.
            - name: Profile keys
              id: keys
              shell: pwsh
              run: |
                  $keys = node dev/build-libs/index.ts --pgo clang,lld,libs --print-pgo-keys | Select-String '^(libs|llvm|ir-clang|ir-lld)='
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $keys | ForEach-Object { $_.Line } | Tee-Object -Append -FilePath $env:GITHUB_OUTPUT

            # Caches are immutable, so a retrained profile can't be saved over the old one: drop the profiles, the prefix built
            # with them, and the resume state that would skip rebuilding with the new profiles.
            - name: Drop cached profiles
              if: ${{ inputs.retrain }}
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  foreach ($prefix in 'pgo-', 'libs-split-', 'llvm-bin-') {
                      foreach ($id in (gh cache list --key $prefix --limit 100 --json id --jq '.[].id')) {
                          gh cache delete $id
                      }
                  }

            # Which profiles are already cached; the jobs below train only the missing ones.
            - name: Library profile cached?
              id: hit-libs
              if: ${{ !inputs.retrain }}
              uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ steps.keys.outputs.libs }}
                  key: pgo-${{ steps.keys.outputs.libs }}
                  lookup-only: true

            - name: LLVM profile cached?
              id: hit-llvm
              if: ${{ !inputs.retrain }}
              uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ steps.keys.outputs.llvm }}
                  key: pgo-${{ steps.keys.outputs.llvm }}
                  lookup-only: true

            - name: Clang IR profile cached?
              id: hit-ir-clang
              if: ${{ !inputs.retrain }}
              uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ steps.keys.outputs.ir-clang }}
                  key: pgo-${{ steps.keys.outputs.ir-clang }}
                  lookup-only: true

            - name: lld IR profile cached?
              id: hit-ir-lld
              if: ${{ !inputs.retrain }}
              uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ steps.keys.outputs.ir-lld }}
                  key: pgo-${{ steps.keys.outputs.ir-lld }}
                  lookup-only: true

    # Clang's IR profile: compiling Sema.cpp. Needs no libraries. Repos go to C:, the workspace drive only has ~14 GB free.
    pgo-clang:
        name: PGO clang
        needs: [pgo-keys, llvm-runtimes]
        if: ${{ needs.pgo-keys.outputs.llvm-hit != 'true' && needs.pgo-keys.outputs.ir-clang-hit != 'true' && (inputs.only == '' || contains(inputs.only, 'llvm-project')) }}
        runs-on: windows-2025
        env:
            PGO_LLVM_IR_CLANG_PROFILE: ${{ needs.pgo-keys.outputs.ir-clang }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup

            # The runtimes (compiler-rt, libc++, libc++abi, libunwind, libomp) the llvm-runtimes job built, unpacked over the prefix:
            # the build uses them and their headers instead of CLANG64's.
            - uses: actions/download-artifact@v8
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang

            - name: Train
              shell: pwsh
              run: node dev/build-libs/index.ts --repos C:/repos --pgo clang --pgo-train --pgo-ir-only --only llvm-project

            - uses: actions/cache/save@v6
              if: always() && hashFiles(format('dev/build-libs/pgo/profiles/{0}', needs.pgo-keys.outputs.ir-clang)) != ''
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.ir-clang }}
                  key: pgo-${{ needs.pgo-keys.outputs.ir-clang }}

    # The library profile, and the PGO libraries built with it (the prefix) for the lld training, which links ImageMagick
    # and its chain. A cached profile only rebuilds the libraries from it (index.ts's --pgo libs --pgo-train stops after the
    # library pipeline either way).
    pgo-libs:
        name: PGO libraries
        needs: [pgo-keys, llvm-runtimes]
        if: ${{ needs.pgo-keys.outputs.libs-hit != 'true' || (needs.pgo-keys.outputs.llvm-hit != 'true' && (inputs.only == '' || contains(inputs.only, 'llvm-project'))) }}
        runs-on: windows-2025
        env:
            PGO_LIBS_PROFILE: ${{ needs.pgo-keys.outputs.libs }}
            # Whether the LLVM profile is still to be trained: its jobs need the prefix.
            LLVM_NEEDED: ${{ needs.pgo-keys.outputs.llvm-hit != 'true' && (inputs.only == '' || contains(inputs.only, 'llvm-project')) }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup

            - name: Restore the library profile
              id: libs
              if: ${{ !inputs.retrain }}
              uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.libs }}
                  key: pgo-${{ needs.pgo-keys.outputs.libs }}

            - name: Restore the prefix
              id: prefix
              if: ${{ !inputs.retrain && env.LLVM_NEEDED == 'true' }}
              uses: actions/cache/restore@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: pgo-libs-prefix-${{ needs.pgo-keys.outputs.libs }}

            # The runtimes (compiler-rt, libc++, libc++abi, libunwind, libomp) the llvm-runtimes job built, unpacked over the prefix:
            # the build uses them and their headers instead of CLANG64's.
            - uses: actions/download-artifact@v8
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang

            - name: Train
              shell: pwsh
              run: node dev/build-libs/index.ts --repos C:/repos --pgo libs --pgo-train --magick-variants q16hdri

            - name: Save the library profile
              if: always() && steps.libs.outputs.cache-hit != 'true' && hashFiles(format('dev/build-libs/pgo/profiles/{0}', needs.pgo-keys.outputs.libs)) != ''
              uses: actions/cache/save@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.libs }}
                  key: pgo-${{ needs.pgo-keys.outputs.libs }}

            - name: Save the prefix
              if: success() && env.LLVM_NEEDED == 'true' && steps.prefix.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: pgo-libs-prefix-${{ needs.pgo-keys.outputs.libs }}

    # lld's IR profile: linking ImageMagick and its chain, from the PGO libraries (the prefix). Without the cached prefix
    # the libraries are rebuilt from the cached library profile.
    pgo-lld:
        name: PGO lld
        needs: [pgo-keys, pgo-libs, llvm-runtimes]
        if: ${{ !failure() && !cancelled() && needs.pgo-keys.outputs.llvm-hit != 'true' && needs.pgo-keys.outputs.ir-lld-hit != 'true' && (inputs.only == '' || contains(inputs.only, 'llvm-project')) }}
        runs-on: windows-2025
        env:
            PGO_LIBS_PROFILE: ${{ needs.pgo-keys.outputs.libs }}
            PGO_LLVM_IR_LLD_PROFILE: ${{ needs.pgo-keys.outputs.ir-lld }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup

            - uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.libs }}
                  key: pgo-${{ needs.pgo-keys.outputs.libs }}
                  fail-on-cache-miss: true

            - uses: actions/cache/restore@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: pgo-libs-prefix-${{ needs.pgo-keys.outputs.libs }}

            # The runtimes (compiler-rt, libc++, libc++abi, libunwind, libomp) the llvm-runtimes job built, unpacked over the prefix:
            # the build uses them and their headers instead of CLANG64's.
            - uses: actions/download-artifact@v8
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang

            - name: Train
              shell: pwsh
              run: node dev/build-libs/index.ts --repos C:/repos --pgo lld,libs --pgo-train --pgo-ir-only --magick-variants q16hdri --only llvm-project

            - uses: actions/cache/save@v6
              if: always() && hashFiles(format('dev/build-libs/pgo/profiles/{0}', needs.pgo-keys.outputs.ir-lld)) != ''
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.ir-lld }}
                  key: pgo-${{ needs.pgo-keys.outputs.ir-lld }}

    # The final LLVM profile: one full-LTO build of clang and lld together, instrumented after LTO's inlining, from both IR
    # profiles, trained on both workloads.
    pgo-llvm:
        name: PGO LLVM
        needs: [pgo-keys, pgo-libs, pgo-clang, pgo-lld, llvm-runtimes]
        if: ${{ !failure() && !cancelled() && needs.pgo-keys.outputs.llvm-hit != 'true' && (inputs.only == '' || contains(inputs.only, 'llvm-project')) }}
        runs-on: windows-2025
        env:
            PGO_LIBS_PROFILE: ${{ needs.pgo-keys.outputs.libs }}
            PGO_LLVM_PROFILE: ${{ needs.pgo-keys.outputs.llvm }}
            PGO_LLVM_IR_CLANG_PROFILE: ${{ needs.pgo-keys.outputs.ir-clang }}
            PGO_LLVM_IR_LLD_PROFILE: ${{ needs.pgo-keys.outputs.ir-lld }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup

            - uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.libs }}
                  key: pgo-${{ needs.pgo-keys.outputs.libs }}
                  fail-on-cache-miss: true

            - uses: actions/cache/restore@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: pgo-libs-prefix-${{ needs.pgo-keys.outputs.libs }}

            - uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.ir-clang }}
                  key: pgo-${{ needs.pgo-keys.outputs.ir-clang }}

            - uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.ir-lld }}
                  key: pgo-${{ needs.pgo-keys.outputs.ir-lld }}

            # The runtimes (compiler-rt, libc++, libc++abi, libunwind, libomp) the llvm-runtimes job built, unpacked over the prefix:
            # the build uses them and their headers instead of CLANG64's.
            - uses: actions/download-artifact@v8
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang

            - name: Train
              shell: pwsh
              run: node dev/build-libs/index.ts --repos C:/repos --pgo clang,lld,libs --pgo-train --magick-variants q16hdri --only llvm-project

            - uses: actions/cache/save@v6
              if: always() && hashFiles(format('dev/build-libs/pgo/profiles/{0}', needs.pgo-keys.outputs.llvm)) != ''
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.llvm }}
                  key: pgo-${{ needs.pgo-keys.outputs.llvm }}

    # The LLVM binaries (clang, lld, lldb, tools), bootstrapped from CLANG64's clang (ownClang: false). Plain -flto=full objects, no
    # fat ones: they only get linked into executables. The runtimes come from the llvm-runtimes job, downloaded before the build.
    llvm:
        name: LLVM
        needs: [pgo-keys, pgo-llvm, llvm-runtimes]
        if: ${{ !failure() && !cancelled() && (inputs.only == '' || contains(inputs.only, 'llvm-project')) }}
        runs-on: windows-2025
        env:
            PGO_LLVM_PROFILE: ${{ needs.pgo-keys.outputs.llvm }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup


            # Resume: restores the installed clang and the build state from the latest earlier run, so a run that hit the 6 h
            # limit continues where it stopped.
            - uses: actions/cache/restore@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: llvm-bin-${{ github.run_id }}
                  restore-keys: llvm-bin-

            - uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.llvm }}
                  key: pgo-${{ needs.pgo-keys.outputs.llvm }}
                  fail-on-cache-miss: true


            # The runtimes the llvm-runtimes job installed, unpacked over the restored prefix so the build links against them.
            - uses: actions/download-artifact@v8
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang

            # Repos go to C:, the workspace drive only has ~14 GB free.
            - name: Build
              shell: pwsh
              run: node dev/build-libs/index.ts --repos C:/repos --pgo clang,lld --only llvm-project

            - uses: actions/cache/save@v6
              if: always()
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: llvm-bin-${{ github.run_id }}

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: llvm-bin-${{ github.run_number }}
                  path: C:/dev-clang
                  include-hidden-files: true
                  compression-level: 9
                  retention-days: 14
                  if-no-files-found: warn

    # compiler-rt, libc++, libc++abi and libunwind, built with CLANG64's clang (see the llvm-runtimes record in libraries.ts). Installs into the
    # same C:/dev-clang layout as the llvm job; unpack both artifacts into one directory.
    llvm-runtimes:
        name: LLVM runtimes
        # Always runs: every other job builds against these runtimes.
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup


            # Resume: restores the installed clang and the build state from the latest earlier run, so a run that hit the 6 h
            # limit continues where it stopped.
            - uses: actions/cache/restore@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: llvm-rt-${{ github.run_id }}
                  restore-keys: llvm-rt-


            # Repos go to C:, the workspace drive only has ~14 GB free.
            - name: Build
              shell: pwsh
              run: node dev/build-libs/index.ts --repos C:/repos --pgo off --only llvm-runtimes

            - uses: actions/cache/save@v6
              if: always()
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: llvm-rt-${{ github.run_id }}

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang
                  include-hidden-files: true
                  compression-level: 9
                  retention-days: 14
                  if-no-files-found: warn

    # Runs parallel to the llvm jobs. Its C:/dev-clang holds only libraries, never the clang the llvm jobs build, so they are
    # compiled with CLANG64's clang (ownClang is set by the presence of C:/dev-clang/release/bin/clang.exe) against the llvm-runtimes install.
    libs:
        name: Libraries
        needs: [pgo-keys, pgo-libs, llvm-runtimes]
        # An llvm-runtimes-only run has no libraries to build; without this the job still trains the PGO chain and builds llvm-runtimes.
        if: ${{ !failure() && !cancelled() && (inputs.only == '' || !contains(inputs.only, 'llvm-runtimes')) }}
        runs-on: windows-2025
        env:
            INPUT_ONLY: ${{ inputs.only }}
            PGO_LIBS_PROFILE: ${{ needs.pgo-keys.outputs.libs }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup


            # Resume: restores the installed libraries and the build state (which libraries are done) from the latest earlier run,
            # so a run that hit the 6 h limit continues where it stopped. The cache key is this job's own, so no clang is restored.
            - uses: actions/cache/restore@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: libs-split-${{ github.run_id }}
                  restore-keys: libs-split-

            # Exactly the library profile for this build's key.
            - uses: actions/cache/restore@v6
              with:
                  path: dev/build-libs/pgo/profiles/${{ needs.pgo-keys.outputs.libs }}
                  key: pgo-${{ needs.pgo-keys.outputs.libs }}
                  fail-on-cache-miss: true


            # The runtimes (compiler-rt, libc++, libc++abi, libunwind, libomp) the llvm-runtimes job built, unpacked over the prefix:
            # the build uses them and their headers instead of CLANG64's.
            - uses: actions/download-artifact@v8
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang

            # Before the Rust step: a release without prebuilt binaries is compiled from source, which the repo's cargo
            # config would route through sccache, not installed yet.
            - name: Install cargo-c
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-c

            # rav1e builds with the repo's global cargo config (win-clang-* profiles, build-std), which needs nightly,
            # rust-src and the gnullvm target. The config's build dir is a path on the author's machine.
            - name: Rust
              shell: pwsh
              run: |
                  rustup toolchain install nightly-x86_64-pc-windows-gnullvm --profile minimal --component rust-src
                  rustup default nightly-x86_64-pc-windows-gnullvm
                  New-Item -ItemType Directory -Force "$HOME/.cargo" | Out-Null
                  (Get-Content configs/config.toml -Raw) -replace 'build-dir = ".*"', 'build-dir = "C:/cargo-build"' | Set-Content "$HOME/.cargo/config.toml"

            # Repos go to C:, the workspace drive only has ~14 GB free. llvm-project is built by the llvm job.
            - name: Build
              shell: pwsh
              run: |
                  $buildArgs = @('--repos', 'C:/repos', '--pgo', 'libs', '--exclude', 'llvm-project,llvm-runtimes,gmp,libyaml,libffi,openssl,ruby-1.8.1,ruby-1.8.7,ruby-1.9.2,ruby-1.9.3,ruby-2.7.8,ruby-3.3.14,ruby-3.4.13,ruby-4.0.10')
                  if ($env:INPUT_ONLY) { $buildArgs += @('--only', $env:INPUT_ONLY) }
                  node dev/build-libs/index.ts @buildArgs

            - uses: actions/cache/save@v6
              if: always()
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: libs-split-${{ github.run_id }}

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: libs-${{ github.run_number }}
                  path: C:/dev-clang
                  include-hidden-files: true
                  compression-level: 9
                  retention-days: 14
                  if-no-files-found: warn

    # The cargo tools in use, with the repo's win-clang-release profile (configs/config.toml) plus -Ztune-cpu=znver1 (rustc's mtune).
    # They come from crates.io, hence `cargo install`: one invocation, so the dependencies the tools share build once in the shared build-dir.
    cargo-tools:
        name: Cargo tools
        if: ${{ inputs.only == '' || contains(inputs.only, 'cargo-tools') }}
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup

            # The latest crates.io version of each tool: the cache key, so a new release rebuilds the tools and nothing else does.
            - name: Tool versions
              id: versions
              shell: pwsh
              run: |
                  $versions = foreach ($crate in 'ripgrep', 'sd', 'fd-find', 'sccache', 'tokei') {
                      $version = (Invoke-RestMethod "https://crates.io/api/v1/crates/$crate" -UserAgent 'build-libs-ci').crate.max_stable_version
                      "$crate-$version"
                  }
                  Add-Content $env:GITHUB_OUTPUT "key=$($versions -join '_')"

            - uses: actions/cache@v6
              id: cargo-tools
              with:
                  path: C:/cargo-tools
                  key: cargo-tools-${{ steps.versions.outputs.key }}

            # The gnullvm target links with CLANG64's clang (lld, compiler-rt, libunwind, the mingw-w64 CRT).
            - name: Toolchain
              if: steps.cargo-tools.outputs.cache-hit != 'true'
              shell: pwsh
              run: |
                  C:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm mingw-w64-clang-x86_64-toolchain"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  Add-Content $env:GITHUB_PATH 'C:\msys64\clang64\bin'
                  rustup toolchain install nightly-x86_64-pc-windows-gnullvm --profile minimal --component rust-src
                  rustup default nightly-x86_64-pc-windows-gnullvm
                  $config = (Get-Content configs/config.toml -Raw) -replace 'build-dir = ".*"', 'build-dir = "C:/cargo-build"'
                  $config = $config -replace '(?s)(\[profile\.win-clang-release\].*?rustflags = \[)', '$1"-Ztune-cpu=znver1",'
                  New-Item -ItemType Directory -Force "$HOME/.cargo" | Out-Null
                  Set-Content "$HOME/.cargo/config.toml" $config

            # RUSTC_WRAPPER is emptied: the config's sccache is one of the tools being built.
            - name: Build
              if: steps.cargo-tools.outputs.cache-hit != 'true'
              shell: pwsh
              env:
                  RUSTC_WRAPPER: ""
              run: cargo install --locked --profile win-clang-release --target x86_64-pc-windows-gnullvm --root C:/cargo-tools ripgrep sd fd-find sccache tokei

            - uses: actions/upload-artifact@v7
              with:
                  name: cargo-tools-${{ github.run_number }}
                  path: C:/cargo-tools/bin
                  compression-level: 9
                  retention-days: 14
                  if-no-files-found: error

    # Every Ruby, one runner each. The 1.x ones are i686 builds with llvm-mingw (msvcrt); the others are full x86_64 builds with
    # CLANG64 against the llvm-runtimes install: shared libruby, every extension, the dependency DLLs next to ruby.exe.
    ruby:
        name: ${{ matrix.ruby }}
        needs: llvm-runtimes
        if: ${{ !failure() && !cancelled() && (inputs.only == '' || contains(inputs.only, 'ruby')) }}
        runs-on: windows-2025
        strategy:
            fail-fast: false
            matrix:
                ruby:
                    - ruby-1.8.1
                    - ruby-1.8.7
                    - ruby-1.9.2
                    - ruby-1.9.3
                    - ruby-2.7.8
                    - ruby-3.3.14
                    - ruby-3.4.13
                    - ruby-4.0.10
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/build-libs-setup

            # ruby.ts expects the toolchain at C:/PATH/llvm-mingw-msvcrt-i686.
            - name: llvm-mingw (i686, msvcrt)
              if: ${{ startsWith(matrix.ruby, 'ruby-1.') }}
              shell: pwsh
              run: |
                  $zip = "$env:RUNNER_TEMP/llvm-mingw.zip"
                  Invoke-WebRequest https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-msvcrt-i686.zip -OutFile $zip
                  New-Item -ItemType Directory -Force C:/PATH | Out-Null
                  Expand-Archive $zip C:/PATH
                  Rename-Item C:/PATH/llvm-mingw-20261117-msvcrt-i686 llvm-mingw-msvcrt-i686

            # Resume: restores the prefix (this Ruby's install and its static dependencies) and the build state from the latest
            # earlier run, so a finished Ruby is not rebuilt and a run that hit the 6 h limit continues where it stopped.
            - uses: actions/cache/restore@v6
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: ${{ matrix.ruby }}-${{ github.run_id }}
                  restore-keys: ${{ matrix.ruby }}-

            - uses: actions/download-artifact@v8
              with:
                  name: llvm-rt-${{ github.run_number }}
                  path: C:/dev-clang

            # Repos go to C:, the workspace drive only has ~14 GB free.
            - name: Build
              shell: pwsh
              run: |
                  $only = "${{ matrix.ruby }}"
                  # The 3.x and 4.x Rubies link gmp, openssl, libyaml and libffi statically: built first, into the prefix.
                  if (-not ($only -like "ruby-1.*" -or $only -like "ruby-2.*")) { $only = "gmp,libyaml,libffi,openssl,$only" }
                  node dev/build-libs/index.ts --repos C:/repos --pgo off --only-release --only $only

            - uses: actions/cache/save@v6
              if: always()
              with:
                  path: |
                      C:/dev-clang
                      dev/build-libs/build-state.json
                  key: ${{ matrix.ruby }}-${{ github.run_id }}

            # Only the install on PATH, like on a user's machine.
            - name: Gems
              if: ${{ !startsWith(matrix.ruby, 'ruby-1.') && !startsWith(matrix.ruby, 'ruby-2.') }}
              shell: pwsh
              run: |
                  $env:PATH = "C:/dev-clang/release/${{ matrix.ruby }}/bin;C:/Windows/System32;C:/Windows"
                  ruby -v
                  gem install rake nokogiri --no-document
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  ruby -rnokogiri -e 'puts Nokogiri::VERSION'

            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.ruby }}-${{ github.run_number }}
                  path: C:/dev-clang/release/${{ matrix.ruby }}
                  include-hidden-files: true
                  compression-level: 9
                  retention-days: 14
                  if-no-files-found: error
