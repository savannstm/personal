name: C++ Release Build (Debian)

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build-debian:
        runs-on: ubuntu-latest
        env:
            CC: clang-19
            CXX: clang++-19
            LD: clang-19
            AR: llvm-ar-19
            RANLIB: llvm-ranlib-19
            NM: llvm-nm-19
            STRIP: llvm-strip-19
            OBJCOPY: llvm-objcopy-19
            OBJDUMP: llvm-objdump-19
            READELF: llvm-readelf-19
            LANG: en_US.UTF-8
            LC_ALL: en_US.UTF-8
            CFLAGS: >-
                -march=x86-64-v3
                -O3
                -fuse-ld=lld
                -fmerge-all-constants
                -ffunction-sections
                -fdata-sections
                -fno-math-errno
                -fno-trapping-math
                -fvisibility=hidden
                -fvisibility-inlines-hidden
                -pipe
            CXXFLAGS: >-
                -march=x86-64-v3
                -O3
                -fuse-ld=lld
                -fmerge-all-constants
                -ffunction-sections
                -fdata-sections
                -fno-math-errno
                -fno-trapping-math
                -fvisibility=hidden
                -fvisibility-inlines-hidden
                -pipe
            LDFLAGS: >-
                -Wl,-O3
                -Wl,--gc-sections
                -Wl,--as-needed
                -Wl,--strip-all
                -Wl,--build-id=none
                -Wl,--icf=all
                -Wl,-z,now
                -Wl,-z,norelro
                -Wl,-z,nosectionheader
        container:
            image: debian:trixie
        steps:
            - uses: actions/checkout@v7

            - name: Install dependencies
              run: |
                  apt-get update && apt-get install -y \
                    build-essential make cmake ninja-build g++ \
                    clang-19 lld-19 llvm-19-tools libclang-common-19-dev \
                    curl ca-certificates locales pkgconf git

            - name: Set locale
              run: |
                  sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen
                  locale-gen

            - name: Cache CMake build
              uses: actions/cache@v6
              with:
                  path: build
                  key: cpp-debian-cmake-build-${{ github.sha }}
                  restore-keys: cpp-debian-cmake-build-

            - name: Build release

              run: |
                  cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
                  cmake --build build -j $(nproc)

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: cpp-debian-release
                  path: build/target/bin/*
                  retention-days: 30
